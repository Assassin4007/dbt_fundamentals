models:
- name: fct_orders
  description: This model consolidates order and payment data to provide a comprehensive
    overview of each order's total amount paid, associating each with the customer
    and order details.
  columns:
  - name: order_id
    description: A unique identifier for each order.
  - name: customer_id
    description: The identifier for the customer who placed the order.
  - name: order_date
    description: The date when the order was placed.
  - name: amount
    description: The total payment amount received for the order, defaulting to 0
      if no payment was recorded.
